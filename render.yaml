services:
  - type: web
    name: video-call-app
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: ALLOWED_ORIGIN
        value: https://chluffy.net
      - key: HOST_NAME
        value: chluffy.net
      - key: RANDOM_MATCH_ENABLED
        value: "false"
